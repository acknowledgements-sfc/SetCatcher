<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Card — Sketch-aligned · SetCatcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="home-layout-shared.css" />
  <link rel="stylesheet" href="home-layout-live-card.css" />
</head>
<body>
  <header class="page-header">
    <h1>Live — sketch-aligned (A + compact)</h1>
    <p>Matches your sketch: one card, “Serato DJ is Armed”, since time, INPUT LEVEL bar, Last timestamp. No Home dashboard. Sidebar route renamed <strong>Live</strong>.</p>
    <span class="variant-tag">Sketch · A + Compact</span>
    · <a href="home-layout-index.html" style="font-size:12px;color:var(--text-secondary)">← All layouts</a>
  </header>

  <div class="toolbar">
    <div class="toolbar-group">
      <span class="toolbar-label">State</span>
      <button type="button" class="state-btn" data-state="noSource">No Source</button>
      <button type="button" class="state-btn" data-state="detected">Detected</button>
      <button type="button" class="state-btn" data-state="ready">Ready</button>
      <button type="button" class="state-btn active" data-state="armed">Armed</button>
      <button type="button" class="state-btn" data-state="capturing">Capturing</button>
      <button type="button" class="state-btn" data-state="saving">Saving</button>
      <button type="button" class="state-btn" data-state="setProtected">Set Protected</button>
      <button type="button" class="state-btn" data-state="attentionNeeded">Attention</button>
    </div>
    <div class="toolbar-group">
      <span class="toolbar-label">Attention</span>
      <span id="attention-buttons"></span>
    </div>
    <div class="toolbar-actions">
      <label><input type="checkbox" id="toggle-recovery" /> Recovery panel</label>
    </div>
  </div>

  <div class="layout-grid">
    <div id="app-root"></div>
    <aside class="preview-col">
      <h2>Menu bar + dropdown</h2>
      <div id="menu-preview"></div>
      <div id="sketch-ref"></div>
    </aside>
  </div>

  <script src="home-layout-shared.js"></script>
  <script>HomeLayoutMock.init("live");</script>
</body>
</html>
