name: SetCatcher
options:
  bundleIdPrefix: app.setcatcher
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
packages:
  SetCatcherPackage:
    path: .
targets:
  SetCatcheriPad:
    type: application
    platform: iOS
    sources:
      - path: Apps/SetCatcherCompanion
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.setcatcher.SetCatcher.iPad
        PRODUCT_NAME: SetCatcher
        INFOPLIST_FILE: Apps/SetCatcherCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/SetCatcherCompanion/SetCatcherCompanion.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    entitlements:
      path: Apps/SetCatcherCompanion/SetCatcherCompanion.entitlements
    dependencies:
      - package: SetCatcherPackage
        product: SetCatcherCompanion
      - package: SetCatcherPackage
        product: SetCatcherCore
      - target: SetCatcherShareExtension
  SetCatcherShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/SetCatcherShareExtension
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.setcatcher.SetCatcher.iPad.ShareExtension
        PRODUCT_NAME: SetCatcherShareExtension
        INFOPLIST_FILE: Apps/SetCatcherShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/SetCatcherShareExtension/SetCatcherShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Apps/SetCatcherShareExtension/SetCatcherShareExtension.entitlements
    dependencies:
      - package: SetCatcherPackage
        product: SetCatcherCompanion
      - package: SetCatcherPackage
        product: SetCatcherCore
schemes:
  SetCatcheriPad:
    build:
      targets:
        SetCatcheriPad: all
        SetCatcherShareExtension: all
    run:
      config: Debug
